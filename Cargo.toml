[package]
name = "mvitop"
version = "0.1.0"
edition = "2024"
description = "A fast native terminal system monitor for Apple Silicon Macs"
license = "MIT"
repository = "https://github.com/kimata1007/mvitop"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
signal-hook = "0.3"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
