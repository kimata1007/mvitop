[package]
name = "mvitop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast native terminal system monitor for Apple Silicon Macs"
license = "MIT"
homepage = "https://github.com/kimata1007/mvitop"
repository = "https://github.com/kimata1007/mvitop"
readme = "README.md"
keywords = ["macos", "apple-silicon", "system-monitor", "gpu", "tui"]
categories = ["command-line-utilities", "hardware-support"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
signal-hook = "0.3"
unicode-width = "0.2"
xml-rs = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
