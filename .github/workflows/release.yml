name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          package_version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "mvitop") | .version')"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "tag version $tag_version does not match Cargo.toml version $package_version" >&2
            exit 1
          fi

      - name: Verify source
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

      - name: Build Apple Silicon binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          cargo build --release --locked
          test "$(lipo -archs target/release/mvitop)" = "arm64"

      - name: Package release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          asset="mvitop-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz"
          mkdir -p dist/package
          cp target/release/mvitop README.md LICENSE dist/package/
          tar -C dist/package -czf "dist/$asset" mvitop README.md LICENSE
          (cd dist && shasum -a 256 "$asset" > SHA256SUMS)
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ steps.package.outputs.asset }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mvitop-${{ env.RELEASE_TAG }}-aarch64-apple-darwin
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/SHA256SUMS

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            "dist/${{ steps.package.outputs.asset }}" \
            dist/SHA256SUMS \
            --clobber

      - name: Request immediate Homebrew update
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::notice::RELEASE_AUTOMATION_TOKEN is not configured; the tap's scheduled updater will pick up this release"
            exit 0
          fi
          gh api \
            --method POST \
            repos/kimata1007/homebrew-tap/dispatches \
            -f event_type=mvitop-released
